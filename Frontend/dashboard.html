<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beevolve — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .dashboard{min-height:100vh;display:grid;place-items:center;padding:30px}
    .dashboard-card{width:min(560px,100%);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:36px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .dashboard-card h1{font-family:'Fraunces',serif;font-size:38px;margin:12px 0}
    .dashboard-card p{color:var(--text-muted);line-height:1.7}
    .profile{margin:24px 0;padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .profile-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
    .profile-row:last-child{border-bottom:0}
    .profile-row span:first-child{color:var(--text-faint)}
    .profile-row span:last-child{word-break:break-word}
  </style>
</head>
<body>
  <main class="dashboard">
    <section class="dashboard-card">
      <div class="eyebrow">Authenticated</div>
      <h1>Welcome to Beevolve.</h1>
      <p>You are successfully signed in. Your session is protected by the Beevolve backend.</p>
      <div id="profile" class="profile">Loading profile…</div>
      <button id="logout" class="btn-primary" type="button">Sign out</button>
    </section>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const profileEl = document.getElementById("profile");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    async function api(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        credentials: "include",
        ...options,
        headers: {
          ...(options.body ? {"Content-Type": "application/json"} : {}),
          ...(options.headers || {})
        }
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.detail || "Request failed.");
      }
      return body;
    }

    (async () => {
      try {
        const auth = await api("/api/auth/me");
        if (!auth.authenticated) {
          window.location.href = "index.html";
          return;
        }

        let profile = null;
        try {
          profile = (await api("/api/auth/profile")).profile;
        } catch (_) {}

        const metadata = auth.user?.user_metadata || {};

        profileEl.innerHTML = `
          <div class="profile-row"><span>Name</span><span>${escapeHtml(profile?.full_name || metadata.full_name || "—")}</span></div>
          <div class="profile-row"><span>Email</span><span>${escapeHtml(auth.user?.email || "—")}</span></div>
          <div class="profile-row"><span>Mobile</span><span>${escapeHtml(profile?.mobile || metadata.mobile || "—")}</span></div>
        `;
      } catch (error) {
        profileEl.textContent = error.message || "Unable to load profile.";
      }
    })();

    document.getElementById("logout").addEventListener("click", async () => {
      try {
        await api("/api/auth/logout", {method: "POST"});
      } finally {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
