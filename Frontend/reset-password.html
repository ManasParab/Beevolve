<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beevolve — Reset password</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="dashboard">
  <section class="dashboard-card">
    <div class="eyebrow">Account security</div>
    <h1>Set a new password</h1>
    <p>Choose a new password with at least 8 characters, including a number and a symbol.</p>
    <form id="reset-form">
      <div class="field">
        <label for="new-password">New password</label>
        <div class="input-wrap">
          <input type="password" id="new-password" minlength="8" required>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <div class="input-wrap">
          <input type="password" id="confirm-password" minlength="8" required>
        </div>
      </div>
      <button class="btn-primary" type="submit">Update password</button>
      <div id="message" class="auth-message" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script>
(async () => {
  const API_BASE = "http://127.0.0.1:8000";
  const message = document.getElementById("message");
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");

  function show(text, type="info") {
    message.textContent = text;
    message.className = "auth-message " + type;
  }

  try {
    if (!accessToken) throw new Error("This password reset link is invalid or expired.");

    const response = await fetch(API_BASE + "/api/auth/oauth/exchange", {
      method: "POST",
      credentials: "include",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({access_token: accessToken, refresh_token: refreshToken})
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || "Unable to start password reset.");

    window.history.replaceState({}, document.title, window.location.pathname);
    show("Reset session ready. Enter your new password.", "success");
  } catch (error) {
    show(error.message, "error");
    document.getElementById("reset-form").querySelector("button").disabled = true;
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("new-password").value;
    const confirm = document.getElementById("confirm-password").value;

    if (password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
      return show("Use at least 8 characters with a letter, number and symbol.", "error");
    }
    if (password !== confirm) return show("Passwords do not match.", "error");

    try {
      const response = await fetch(API_BASE + "/api/auth/update-password", {
        method: "POST",
        credentials: "include",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password})
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || "Unable to update password.");
      show("Password updated successfully. Redirecting to login…", "success");
      setTimeout(() => window.location.href = "index.html", 1200);
    } catch (error) {
      show(error.message, "error");
    }
  });
})();
</script>
</body>
</html>
